name: AetherSpigot
version: 1.0.0
author: AetherNetwork
main: net.aether.spigot.AetherPlugin
description: Moteur HCF practice pour Spigot 1.8.8
softdepend: [ViaVersion, ViaBackwards, ViaRewind]
commands:
  aether:
    description: Ouvre le menu AetherSpigot
    usage: /aether [menu|reload|version]
    aliases: [aetherspigot]
  config:
    description: Menu ou rechargement des configs
    usage: /config [menu|reload]
  knockback:
    description: Profils de knockback
    usage: /knockback
    aliases: [kb]
  ping:
    description: Ping
    usage: /ping [joueur]
  tps:
    description: Etat du serveur
    usage: /tps
  clearlag:
    description: Retire les entites au sol
    usage: /clearlag
  unloadchunks:
    description: Decharge les chunks vides
    usage: /unloadchunks
  setmaxplayers:
    description: Change le nombre de slots
    usage: /setmaxplayers <nombre>
  hide:
    description: Cache un joueur (lui, ses projectiles, ses sons)
    usage: /hide <joueur> [observateur]
  see:
    description: Montre de nouveau un joueur cache
    usage: /see <joueur> [observateur]
permissions:
  aether.admin:
    description: Acces complet au menu et aux commandes
    default: op
    children:
      aether.config: true
      aether.knockback: true
      aether.tps: true
      aether.clearlag: true
      aether.chunks: true
      aether.slots: true
      aether.ping.others: true
      aether.isolation: true
  aether.isolation:
    default: op
  aether.config:
    default: op
  aether.knockback:
    default: op
  aether.tps:
    default: op
  aether.clearlag:
    default: op
  aether.chunks:
    default: op
  aether.slots:
    default: op
  aether.ping:
    default: true
  aether.ping.others:
    default: op
  aether.version:
    default: true
